# Language-Agnostic Pre-Commit Quality Gate Configuration

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Syntax only: mkdocs.yml's mermaid fence uses MkDocs' `!!python/name:` tag, which the
        # safe loader cannot construct. --unsafe still fails malformed YAML; it parses without
        # building the tagged objects (docs-site-standard, #135).
        args: ['--unsafe']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.16.0
    hooks:
      - id: markdownlint-cli2
        files: (\.md|\.cursorrules|\.windsurfrules)$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: append-timestamps
        name: Append Markdown Timestamps
        entry: python3 scripts/append_timestamps.py
        language: system
        files: (\.md|\.cursorrules|\.windsurfrules)$
        pass_filenames: false

      - id: check-docs-review
        name: Check Documentation Review Staleness
        entry: python3 scripts/check_docs_review.py --max-review-days 180 --max-update-days 180
        language: system
        files: (\.md|\.cursorrules|\.windsurfrules)$
        pass_filenames: false

      # `--mode template` exempts the un-bootstrapped stubs (AGENTS.md,
      # CODE_OF_CONDUCT.md, ...) whose placeholders this repository is supposed to
      # still carry. bootstrap_template.py drops the flag in the adopter's copy so
      # their repository is checked strictly. pass_filenames: false because the
      # doctor walks the whole tree, including files no commit touched.
      - id: doctor
        name: Verify No Template Placeholders Survive
        entry: python3 scripts/doctor.py --mode template
        language: system
        always_run: true
        pass_filenames: false

      # language: python rather than system: the generator parses SKILL.md frontmatter
      # with PyYAML, and an isolated hook environment means it never depends on which
      # interpreter happens to be first on PATH.
      - id: skill-index
        name: Check AGENTS.md Skill Index Is Generated
        entry: python3 scripts/generate_skill_index.py --check
        language: python
        additional_dependencies: ['PyYAML==6.0.3']
        files: ^(AGENTS\.md|\.agents/skills/.*|scripts/generate_skill_index\.py)$
        pass_filenames: false

      # Blocking project invariants from .guards.json (see scripts/check_guards.py for
      # how they differ from the advisory .semgrep.yaml rules). always_run because a
      # guard edit can make an untouched file start failing.
      - id: check-guards
        name: Check Project Guards
        entry: python3 scripts/check_guards.py
        language: system
        always_run: true
        pass_filenames: false

      - id: check-provider-redirects
        name: Validate Provider Redirects
        entry: python3 scripts/check_provider_redirects.py
        language: system
        files: ^(CLAUDE\.md|GEMINI\.md|\.cursorrules|\.windsurfrules|\.github/copilot-instructions\.md)$
        pass_filenames: false

      # Runs on every commit regardless of staged files: it checks the repository's
      # author identity, not file content. Blocking here means an unattributable
      # author email is fixed with `git config` before the commit exists, rather than
      # by rewriting history after a ruleset blocks the merge.
      - id: check-commit-attribution
        name: Check Commit Author Attribution
        entry: python3 scripts/check_commit_attribution.py
        language: system
        always_run: true
        pass_filenames: false
