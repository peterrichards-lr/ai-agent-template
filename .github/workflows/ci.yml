name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel-in-progress: false because this job supplies a required status check in
  # .github/rulesets/protect-main-branch.json. Queuing rather than cancelling ensures
  # the newest run reports last so the final check status reflects the latest state,
  # and avoids aborting runs mid-execution. Note that GitHub still cancels pending runs
  # if a newer run queues behind them. See #30.
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Code & Documentation Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-python.txt

      # requirements-dev.txt holds the language-agnostic quality gate tooling every
      # adopter needs; requirements-python.txt holds the Python-project test deps that
      # --clean-template strips from a Go/Rust/Node project. This repository is itself
      # a Python project (its self-tests run under pytest), so CI installs both.
      - name: Install Python Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-python.txt

      # One step, deliberately. `make verify` is lint + test + docs, and the whole point
      # of the task runner (#46) is that this is the *same* command a contributor runs
      # locally. Restating pytest / doctor / check_docs_review / pre-commit here would
      # recreate the drift between local and CI gates that the Makefile removes.
      # scripts/doctor.py --mode template runs inside `make lint` as a pre-commit hook.
      - name: Run Quality Gate (make verify)
        run: |
          make verify
