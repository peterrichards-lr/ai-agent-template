name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel-in-progress: false because this job supplies a required status check in
  # .github/rulesets/protect-main-branch.json. Queuing rather than cancelling ensures
  # the newest run reports last so the final check status reflects the latest state,
  # and avoids aborting runs mid-execution. Note that GitHub still cancels pending runs
  # if a newer run queues behind them. See #30.
  cancel-in-progress: false

jobs:
  filter:
    name: Filter Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.cursorrules'
              - '!.windsurfrules'

  # NOTE: quality-gate and quality-gate-skip both declare the identical display name:
  # "Code & Documentation Quality Verification". This is intentional and required:
  # .github/rulesets/protect-main-branch.json mandates "Code & Documentation Quality Verification"
  # as a strict required status check. If path filtering skips the check entirely, GitHub
  # deadlocks the PR waiting for status to report. With this dual-job pattern, exactly
  # one of the two jobs runs and reports success under that exact context name. See #44.
  quality-gate:
    needs: filter
    if: needs.filter.outputs.code == 'true'
    name: Code & Documentation Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install Python Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit Test Suite
        run: |
          python -m pytest -v tests/

      - name: Verify Documentation Timestamps & Review Status
        run: |
          python scripts/check_docs_review.py --max-review-days 180 --max-update-days 180

      - name: Run Pre-Commit Quality Gate Hooks
        run: |
          pre-commit run --all-files

  quality-gate-skip:
    needs: filter
    if: needs.filter.outputs.code != 'true'
    name: Code & Documentation Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Skip heavy verification for docs-only changes
        run: echo "Skipped heavy quality gate for docs-only change to satisfy required status check."
