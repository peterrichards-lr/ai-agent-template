name: Issue Link Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # cancel-in-progress: false because this job supplies a required status check in
  # .github/rulesets/protect-main-branch.json. Queuing rather than cancelling ensures
  # the newest run reports last so the final check status reflects the latest state,
  # and avoids aborting runs mid-execution. Note that GitHub still cancels pending runs
  # if a newer run queues behind them. See #30.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  check-issue-link:
    name: Verify PR references an issue
    runs-on: ubuntu-latest
    steps:
      - name: Check for a closing issue reference or override label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels -q '.labels[].name')
          if echo "$labels" | grep -qx "no-issue-needed"; then
            echo "OK: 'no-issue-needed' label present, skipping issue-link requirement."
            exit 0
          fi

          title=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title -q '.title')
          body=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q '.body // ""')

          if echo "$title"$'\n'"$body" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b[[:space:]]*:?[[:space:]]*#[0-9]+'; then
            echo "OK: found a Closes/Fixes/Resolves #N reference."
            exit 0
          fi

          echo "::error::This PR doesn't reference a closing issue (e.g. 'Closes #123' in the title or body)."
          echo "Every PR should close a tracked GitHub issue, per .agents/skills/github-workflow/SKILL.md,"
          echo "so work items and tech debt stay tracked even when not addressed immediately."
          echo "If this change is genuinely too trivial to need one, add the 'no-issue-needed' label instead."
          exit 1
