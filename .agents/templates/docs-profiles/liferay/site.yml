# Liferay profile (bootstrap_template.py --docs-profile liferay). The Liferay
# tools family's shared values; see .agents/skills/docs-site-standard/SKILL.md,
# "The Liferay profile". Each tool uses its own mark: no official Liferay logo or
# waffle in the header, favicon, social preview or README (DESIGN-10350).
copyright: >-
  A community project &mdash; not an official Liferay product

extra_css:
  - assets/stylesheets/liferay-blue.css   # SHARED FILE, mapped in .agents/TEMPLATE_REF.md
  # A site-specific stylesheet goes here, AFTER liferay-blue.css; never edit that one.

extra:
  # social_image: assets/social-preview.png    # 1280x640; needs site_url
  # favicon_svg: assets/favicon.svg
  # google_site_verification: TOKEN
  # bing_site_verification: TOKEN
  docs_standard:
    # The H1 is "<project_name> documentation", and project_name picks out this
    # site's own row in `related` below. Use the full name, not the repo slug.
    project_name: <PROJECT_NAME_PLACEHOLDER>
    # Names a sentence-case nav label may capitalise mid-label (NAV check).
    proper_nouns: [Liferay]
    # OFF until the home page follows the standard (docs-site-standard, rules 1 and 6): a new
    # project's home has neither the notice nor the layout yet, and its first deploy would
    # fail on them. Turn both on in the same change that writes them.
    home_layout: false
    # notice:
    #   title: Community project
    #   text: Not an official Liferay product and not covered by Liferay Support
    #   link_text: About this project
    # Deleting a key above switches its check off, and the build stays green. Once the site
    # meets them, name the checks it cannot do without: each fails, naming its key, if that
    # key is ever removed (docs-site-standard, rule 5).
    # required: [MISSING-VERIFICATION, MISSING-SOCIAL, NO-NOTICE, HOME-LAYOUT]
    related:
      heading: Related Liferay tools
      intro: >-
        Three community tools from the same maintainer. None is an official
        Liferay product or covered by Liferay Support.
      rows:
        - name: Liferay Docker Manager
          url: https://peterrichards-lr.github.io/liferay-docker-manager/
          description: Run, manage and develop Liferay DXP and Portal environments in Docker.
        - name: Liferay AI Commerce Accelerator
          url: https://peterrichards-lr.github.io/liferay-ai-commerce-accelerator/
          description: Generate and manage AI-driven commerce data in Liferay DXP.
        - name: Liferay Tunnel
          url: https://peterrichards-lr.github.io/lfr-tunnel/
          description: Securely expose a local Liferay environment on a public HTTPS subdomain.
