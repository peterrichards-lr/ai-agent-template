name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel-in-progress: false because this workflow supplies a required status check in
  # .github/rulesets/protect-main-branch.json. Queuing rather than cancelling ensures
  # the newest run reports last so the final check status reflects the latest state,
  # and avoids aborting runs mid-execution. Note that GitHub still cancels pending runs
  # if a newer run queues behind them. See #30.
  cancel-in-progress: false

# Two layers, and only the second one is path-filtered.
#
#   quality-gate    always runs: documentation footers, markdownlint, provider redirects,
#                   the placeholder doctor -- the language-agnostic half of `make verify`.
#   build-and-test  Go's lint and test, behind a paths filter.
#
# PR #75 filtered the whole workflow and had to be reverted before merge, because ci.yml
# was entirely documentation validation: excluding `**/*.md` disabled the skill-routing
# drift test, the provider-redirect check, the doc-footer guard and markdownlint for
# exactly the pull requests those checks exist to catch. The rule is not "do not filter",
# it is "filter the heavy build, never the doc checks". See #42 and #44.
#
# Between them the two jobs run everything `make verify` runs, once each and with no
# overlap, because the Makefile decomposes along the same seam:
#
#   make verify    = lint + test + docs = (lint-tooling + lint-lang) + test + docs
#   quality-gate   =                       lint-tooling              +          docs
#   build-and-test =                                      lint-lang  + test
#
# Every command itself still lives in the Makefile. Restating pytest / cargo / go here
# would recreate the local-versus-CI drift the task runner (#46) exists to remove.
jobs:
  quality-gate:
    # Deliberately carries no `needs:` and no `if:`. This job supplies the required
    # status check `Code & Documentation Quality Verification` named in
    # .github/rulesets/protect-main-branch.json, and it must report on every push and
    # pull request -- documentation-only ones most of all, since its checks are the
    # ones that read documentation. Do not rename it without updating the ruleset:
    # a required context that matches no job name never reports, and the pull request
    # then waits for it forever.
    name: Code & Documentation Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python is the tooling runtime, not the project's language: pre-commit and the
      # scripts/ helpers behind `make lint-tooling` and `make docs` are Python whatever
      # this project is written in.
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install language-agnostic tooling
        run: make setup-tooling

      # `make lint-tooling` is `pre-commit run --all-files`, which is where
      # markdownlint, detect-secrets, gitleaks, actionlint, the provider-redirect check
      # and `scripts/doctor.py --mode template` all run. `make docs` refreshes and then
      # verifies the timestamp footers. Neither is restated here.
      - name: Verify documentation and run the pre-commit gate
        run: make lint-tooling docs

  filter:
    name: Detect Buildable Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, unlike the other jobs. On a `pull_request` event the filter
          # resolves changed files through the API, but on `push` it diffs against the
          # previous commit, which a depth-1 clone does not contain. A filter that
          # errors is not a silent no-op here: build-and-test-skip turns it into a red
          # `Build & Test`, so getting this wrong would block merges rather than quietly
          # over-build. This job compiles nothing, so the extra clone is cheap.
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '**'
              # The documentation exclusions ship commented out, and that is the whole
              # lesson of #44/#75 encoded at the point where it would be repeated.
              # Before uncommenting, check that nothing behind this filter READS the
              # paths you are about to exclude. This template's own test suite asserts
              # documentation is in sync -- skill-routing tables, the README tree,
              # provider redirects -- so excluding '**/*.md' here would stop those
              # tests running on precisely the pull requests they exist to catch.
              # An adopter whose tests do not read their markdown can safely enable
              # them; `Build & Test` then reports through build-and-test-skip.
              # - '!**/*.md'
              # - '!docs/**'
              # - '!.cursorrules'
              # - '!.windsurfrules'

  # build-and-test and build-and-test-skip declare the SAME `name:`, deliberately.
  # GitHub reports one check-run context per job *name*, so whichever of the pair runs,
  # a status called `Build & Test` is always reported. That is what stops a
  # documentation-only pull request deadlocking in "Expected - Waiting for status to be
  # reported" once the filter's documentation exclusions above are enabled.
  #
  # `Build & Test` IS a required status check in
  # .github/rulesets/protect-main-branch.json, because a template that ships CI whose
  # failure nobody has to act on has shipped decoration. If your project cannot build
  # yet -- `--lang generic` makes `make test` exit non-zero by design, and the Node and
  # Java profiles need a lockfile or pom.xml first -- delete that one context from the
  # ruleset before importing it, and add it back when the build is green.
  # See docs/BRANCH_PROTECTION.md.
  build-and-test:
    name: Build & Test
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    # No `strategy.matrix` here, deliberately. GitHub reports a matrix job's context as
    # `Build & Test (some-value)` and never the bare name, so the required check would
    # wait forever and the ruleset context validator would fail it as unmatched. If you
    # need a matrix, keep this job as the fixed-name aggregator and put the matrix in a
    # separate job that this one `needs:`.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 'stable' rather than `go-version-file: go.mod` so this workflow also runs on
          # a freshly bootstrapped repository that has no go.mod yet. Switch to
          # go-version-file once go.mod is committed, so CI and the toolchain a
          # contributor runs locally cannot disagree about the version.
          go-version: 'stable'
          cache: false

      # `make test` is the EDR-safe compiled-binary path, never `go test ./...`: the
      # Makefile's go profile exports GOTMPDIR to an allowlisted directory -- GOTMPDIR,
      # not -o, is where the toolchain links every executable before moving it -- and its
      # edr-guard target asserts the resolved value before anything is built. See #2 and
      # .agents/skills/unit-testing/SKILL.md.

      # `make setup` rather than `make setup-lang`: the seven verbs are the contract, and
      # a stack whose tests import a tool from requirements-dev.txt (this template's own
      # do) would otherwise fail for a reason no reading of this file could explain.
      - name: Install dependencies
        run: make setup

      - name: Lint and test Go
        run: make lint-lang test

  build-and-test-skip:
    name: Build & Test
    needs: filter
    # `always()` is load-bearing, not defensive noise. GitHub skips a dependent job when
    # a `needs:` job fails, whatever the `if:` says, unless the condition is `always()`
    # or `!cancelled()`. Without it a failed filter would skip this job as well as
    # build-and-test, nothing would report `Build & Test`, and the deadlock the
    # same-named pair exists to remove would simply have moved to the filter job.
    if: ${{ always() && needs.filter.outputs.code != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report documentation-only change or failed change detection
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
        run: |
          set -euo pipefail
          if [ "$FILTER_RESULT" != "success" ]; then
            echo "Change detection did not succeed (filter job result: $FILTER_RESULT)."
            echo "Failing loudly: reporting success here would green-light a build that"
            echo "never ran, and reporting nothing at all would deadlock the pull request."
            exit 1
          fi
          echo "Documentation-only change: no build or test to run."
